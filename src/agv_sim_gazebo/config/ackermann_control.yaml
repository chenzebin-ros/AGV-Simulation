ackermann_steering_controller:
  type: "ackermann_steering_controller/AckermannSteeringController"
  rear_wheel: 'rear_wheel'
  front_steer: 'front_steer'
  publish_rate: 50.0
  pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
  twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
  wheel_base: 1.0
  wheel_separation: 0.9
  wheel_radius: 0.15
  rear_wheel_radius_multiplier: 1.0
  front_wheel_radius_multiplier: 1.0
  front_steer_joints: ['front_left_steer_joint', 'front_right_steer_joint']
  rear_wheel_joints: ['rear_left_wheel_joint', 'rear_right_wheel_joint']
